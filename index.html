<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>销售经营 AI Copilot</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #dce3ef;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --primary-soft: #e8f0ff;
      --green: #13a37f;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .18), transparent 34vw),
        radial-gradient(circle at bottom right, rgba(19, 163, 127, .12), transparent 34vw),
        var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      height: 100vh;
      padding: 20px;
    }

    .sidebar, .main {
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(220, 227, 239, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--green));
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 16px;
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .status strong { color: var(--text); }
    .status .ok { color: var(--green); font-weight: 700; }
    .status .warn { color: #d97706; font-weight: 700; }

    .section-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      margin: 18px 0 10px;
    }

    .chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      text-align: left;
      padding: 10px 12px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 13px;
      transition: .15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .metric {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .metric b {
      display: block;
      font-size: 16px;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      color: #344054;
    }

    .messages {
      overflow: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      align-items: flex-start;
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      background: var(--green);
    }

    .user .avatar { background: var(--primary); }

    .bubble {
      max-width: min(780px, 84%);
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 18px;
      padding: 14px 16px;
      line-height: 1.65;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
      overflow: hidden;
    }

    .user .bubble {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
    }

    .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; font-size: 16px; }
    .bubble p { margin: 0 0 10px; }
    .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 22px; }
    .bubble code { background: #f1f5f9; border-radius: 6px; padding: 1px 4px; }

    .meta-box {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fbfdff;
    }

    .meta-toggle {
      width: 100%;
      border: 0;
      background: #f8fafc;
      padding: 10px 12px;
      text-align: left;
      color: #344054;
      font-weight: 700;
      cursor: pointer;
    }

    .meta-content { display: none; padding: 12px; }
    .meta-box.open .meta-content { display: block; }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }

    .table-wrap {
      margin-top: 12px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      max-height: 360px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 10px;
      white-space: nowrap;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      z-index: 1;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: rgba(255,255,255,.88);
    }

    .composer-inner {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 18px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      font: inherit;
      line-height: 1.5;
      padding: 10px 8px;
      background: transparent;
    }

    .send {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      min-width: 88px;
    }

    .send:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .block-stack { display: grid; gap: 12px; }

    .bi-card {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
      border-radius: 16px;
      padding: 14px;
    }

    .bi-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .kpi-card {
      border: 1px solid #dbeafe;
      background: #eff6ff;
      border-radius: 14px;
      padding: 12px;
    }

    .kpi-card b { display: block; font-size: 18px; color: #1d4ed8; }
    .kpi-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-pill { padding: 6px 10px; border-radius: 999px; background: #ecfdf3; color: #027a48; font-size: 12px; font-weight: 700; }

    .insight-list, .action-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .insight-list li, .action-list li {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .bar-chart { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
    .bar-track { height: 10px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--green)); }
    .bar-value { color: var(--muted); font-variant-numeric: tabular-nums; }

    .followups { display: flex; flex-wrap: wrap; gap: 8px; }
    .followup-btn { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 10px; cursor: pointer; color: #344054; }
    .followup-btn:hover { background: var(--primary-soft); border-color: var(--primary); }

    .mobile-chips { display: none; }
    .typing { color: var(--muted); }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        height: 100dvh;
        padding: 0;
        gap: 0;
      }

      .sidebar {
        display: none;
      }

      .main {
        border-radius: 0;
        border: 0;
        height: 100dvh;
      }

      .topbar {
        padding: 14px 16px;
        align-items: flex-start;
      }

      .topbar h2 { font-size: 17px; }
      .topbar p { font-size: 12px; }
      .clear-btn { padding: 8px 10px; }

      .messages {
        padding: 14px;
      }

      .bubble {
        max-width: 88%;
        padding: 12px 13px;
        border-radius: 16px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }

      .mobile-chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 0 0 10px;
      }

      .mobile-chips .chip {
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .bar-row { grid-template-columns: 90px 1fr; }
      .bar-value { grid-column: 2; }
      .composer { padding: 10px; }
      .composer-inner { border-radius: 16px; }
      .send { min-width: 70px; padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <h1>销售经营 AI Copilot</h1>
          <p>自然语言问数 · 客户诊断 · 机会建议</p>
        </div>
      </div>

      <div class="status" id="status">正在检查数据与模型配置...</div>

      <div class="section-title">推荐问题</div>
      <div class="chips" id="desktopChips"></div>

      <div class="section-title">数据范围</div>
      <div class="metric-grid">
        <div class="metric"><b>3万</b><span>日级宽表记录</span></div>
        <div class="metric"><b>81</b><span>分析字段</span></div>
        <div class="metric"><b>5个月</b><span>2026-01 至 05</span></div>
        <div class="metric"><b>34</b><span>汽车品牌</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>销售问数会话</h2>
          <p>输入一句话，AI 会自动查询本地 CSV 数据源并生成分析结论。</p>
        </div>
        <button class="clear-btn" id="clearBtn">清空</button>
      </header>

      <section class="messages" id="messages">
        <div class="mobile-chips" id="mobileChips"></div>
      </section>

      <footer class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="例如：哪些客户消耗高但没有订单？"></textarea>
          <button class="send" id="sendBtn">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const suggestions = [
      '我想拜访一个客户，告诉我几个有用的话术',
      '我的客户中本月环比上月消耗下降20%的客户出现哪些问题，给我做归因分析',
      '本月客户消耗 Top10 是谁？',
      '哪些客户余额快没了？',
      '哪些客户消耗高但没有订单？',
      '哪些客户逾期应收最高？',
      '线索通和信息流广告哪个效果更好？',
      '哪些客户适合追加预算？'
    ];

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const desktopChips = document.getElementById('desktopChips');
    const mobileChips = document.getElementById('mobileChips');
    const history = [];

    function initChips() {
      for (const text of suggestions) {
        const btn1 = makeChip(text);
        const btn2 = makeChip(text);
        desktopChips.appendChild(btn1);
        mobileChips.appendChild(btn2);
      }
    }

    function makeChip(text) {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = text;
      btn.onclick = () => {
        inputEl.value = text;
        sendMessage();
      };
      return btn;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    function markdownLite(text) {
      let html = escapeHtml(text);
      html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      html = html.replace(/\n{2,}/g, '</p><p>');
      html = html.replace(/\n/g, '<br>');
      return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
    }

    function appendMessage(role, content, meta) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '我' : 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (role === 'assistant' && meta && Array.isArray(meta.blocks) && meta.blocks.length) {
        bubble.appendChild(renderBlocks(meta.blocks));
      } else {
        bubble.innerHTML = role === 'assistant' ? markdownLite(content) : escapeHtml(content);
      }

      if (meta) {
        bubble.appendChild(buildMeta(meta));
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrapper;
    }

    function createCard(title) {
      const card = document.createElement('div');
      card.className = 'bi-card';
      if (title) {
        const h = document.createElement('div');
        h.className = 'bi-title';
        h.textContent = title;
        card.appendChild(h);
      }
      return card;
    }

    function renderBlocks(blocks) {
      const stack = document.createElement('div');
      stack.className = 'block-stack';
      for (const block of blocks) {
        const el = renderBlock(block);
        if (el) stack.appendChild(el);
      }
      return stack;
    }

    function renderBlock(block) {
      if (!block || !block.type) return null;
      if (block.type === 'summary') {
        const card = createCard(block.title || '结论');
        const content = document.createElement('div');
        content.innerHTML = markdownLite(block.content || '');
        card.appendChild(content);
        return card;
      }
      if (block.type === 'kpi_cards') {
        const grid = document.createElement('div');
        grid.className = 'kpi-grid';
        for (const item of block.items || []) {
          const card = document.createElement('div');
          card.className = 'kpi-card';
          card.innerHTML = `<b>${escapeHtml(item.value)}</b><span>${escapeHtml(item.label)}</span>`;
          grid.appendChild(card);
        }
        const wrap = createCard(block.title || '核心指标');
        wrap.appendChild(grid);
        return wrap;
      }
      if (block.type === 'tags') {
        const wrap = createCard(block.title || '标签');
        const list = document.createElement('div');
        list.className = 'tag-list';
        for (const item of block.items || []) {
          const tag = document.createElement('span');
          tag.className = 'tag-pill';
          tag.textContent = item;
          list.appendChild(tag);
        }
        wrap.appendChild(list);
        return wrap;
      }
      if (block.type === 'insights' || block.type === 'actions') {
        const wrap = createCard(block.title || (block.type === 'actions' ? '建议动作' : '主要发现'));
        const list = document.createElement('ul');
        list.className = block.type === 'actions' ? 'action-list' : 'insight-list';
        for (const item of block.items || []) {
          const li = document.createElement('li');
          li.textContent = item;
          list.appendChild(li);
        }
        wrap.appendChild(list);
        return wrap;
      }
      if (block.type === 'table') {
        const wrap = createCard(block.title || '明细数据');
        wrap.appendChild(buildTable(block.columns || [], block.rows || []));
        return wrap;
      }
      if (block.type === 'chart') {
        return renderChartBlock(block);
      }
      if (block.type === 'followups') {
        const wrap = createCard(block.title || '你可以继续问');
        const list = document.createElement('div');
        list.className = 'followups';
        for (const item of block.items || []) {
          const btn = document.createElement('button');
          btn.className = 'followup-btn';
          btn.textContent = item;
          btn.onclick = () => { inputEl.value = item; sendMessage(); };
          list.appendChild(btn);
        }
        wrap.appendChild(list);
        return wrap;
      }
      return null;
    }

    function renderChartBlock(block) {
      const wrap = createCard(block.title || '趋势图');
      const chart = document.createElement('div');
      chart.className = 'bar-chart';
      const items = (block.data && block.data.items) || [];
      const max = Math.max(...items.map(item => Number(item.value) || 0), 1);
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'bar-row';
        const label = document.createElement('div');
        label.textContent = item.label;
        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = `${Math.max(4, (Number(item.value) || 0) / max * 100)}%`;
        track.appendChild(fill);
        const value = document.createElement('div');
        value.className = 'bar-value';
        value.textContent = Number(item.value || 0).toLocaleString();
        row.appendChild(label);
        row.appendChild(track);
        row.appendChild(value);
        chart.appendChild(row);
      }
      wrap.appendChild(chart);
      return wrap;
    }

    function buildMeta(meta) {
      const debug = meta.debug || {};
      const sqlText = debug.sql || meta.sql || '';
      const reasonText = debug.reason || meta.reason || '';
      const hasRows = meta.rows && meta.rows.length;
      if (!sqlText && !reasonText && !hasRows && !meta.intent) return document.createDocumentFragment();

      const box = document.createElement('div');
      box.className = 'meta-box';
      const toggle = document.createElement('button');
      toggle.className = 'meta-toggle';
      toggle.textContent = `查看执行明细${meta.fallback ? '（本地兜底）' : ''}`;
      toggle.onclick = () => box.classList.toggle('open');
      const content = document.createElement('div');
      content.className = 'meta-content';

      const route = document.createElement('p');
      route.innerHTML = `<strong>意图/技能：</strong>${escapeHtml(meta.intent || '-')} / ${escapeHtml(meta.skill || '-')}`;
      content.appendChild(route);

      if (reasonText) {
        const reason = document.createElement('p');
        reason.innerHTML = `<strong>查询逻辑：</strong>${escapeHtml(reasonText)}`;
        content.appendChild(reason);
      }
      if (sqlText) {
        const sql = document.createElement('pre');
        sql.textContent = sqlText;
        content.appendChild(sql);
      }
      if (hasRows) {
        content.appendChild(buildTable(meta.columns || Object.keys(meta.rows[0]), meta.rows));
      }

      box.appendChild(toggle);
      box.appendChild(content);
      return box;
    }

    function buildTable(columns, rows) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      for (const col of columns) {
        const th = document.createElement('th');
        th.textContent = col;
        tr.appendChild(th);
      }
      thead.appendChild(tr);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (const row of rows.slice(0, 100)) {
        const trBody = document.createElement('tr');
        for (const col of columns) {
          const td = document.createElement('td');
          td.textContent = row[col] ?? '';
          trBody.appendChild(td);
        }
        tbody.appendChild(trBody);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;
      appendMessage('user', text);
      inputEl.value = '';
      autoResize();
      sendBtn.disabled = true;
      const loading = appendMessage('assistant', '<span class="typing">正在理解问题并选择合适的销售分析技能...</span>');
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });
        const data = await resp.json();
        loading.remove();
        if (!resp.ok || data.error) throw new Error(data.error || '请求失败');
        appendMessage('assistant', data.answer, data);
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.answer });
      } catch (err) {
        loading.remove();
        appendMessage('assistant', `## 请求失败\n${err.message}\n\n请检查服务是否运行，以及 MiniMax API 环境变量是否配置正确。`);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, 140)}px`;
    }

    async function loadHealth() {
      try {
        const resp = await fetch('/api/health');
        const data = await resp.json();
        statusEl.innerHTML = `
          <div><strong>数据表：</strong>${escapeHtml(data.table)}</div>
          <div><strong>字段数：</strong>${data.columns}</div>
          <div><strong>MiniMax：</strong><span class="${data.minimaxConfigured ? 'ok' : 'warn'}">${data.minimaxConfigured ? '已配置' : '未配置，本地兜底'}</span></div>
          <div><strong>模型：</strong>${escapeHtml(data.model)}</div>
        `;
      } catch {
        statusEl.innerHTML = '<span class="warn">服务未连接</span>';
      }
    }

    sendBtn.onclick = sendMessage;
    clearBtn.onclick = () => {
      [...messagesEl.querySelectorAll('.msg')].forEach(el => el.remove());
      history.length = 0;
      appendWelcome();
    };
    inputEl.addEventListener('input', autoResize);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function appendWelcome() {
      appendMessage('assistant', `## 你好，我是销售经营 AI Copilot\n你可以直接问我销售经营、客户投放、线索转化、ROI、余额、逾期应收等问题。\n\n例如：\n- 本月客户消耗 Top10 是谁？\n- 哪些客户消耗高但没有订单？\n- 线索通和信息流广告哪个效果更好？\n- 哪些客户适合追加预算？`);
    }

    initChips();
    loadHealth();
    appendWelcome();
  </script>
</body>
</html>

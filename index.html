<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>销数通 AI Copilot</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #dce3ef;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --primary-soft: #e8f0ff;
      --green: #13a37f;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .18), transparent 34vw),
        radial-gradient(circle at bottom right, rgba(19, 163, 127, .12), transparent 34vw),
        var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      height: 100vh;
      padding: 20px;
    }

    .sidebar-overlay { display: none; }

    .sidebar, .main {
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(220, 227, 239, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--green));
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      display: grid;
      gap: 4px;
    }

    .status strong { color: var(--text); }
    .status .ok { color: var(--green); font-weight: 700; }
    .status .warn { color: #d97706; font-weight: 700; }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin: 12px 0 7px;
    }

    .chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      text-align: left;
      padding: 8px 10px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 12px;
      transition: .15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .session-list {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
    }

    .session-item {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 9px 10px;
      text-align: left;
      cursor: pointer;
      color: #344054;
    }

    .session-item.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-2);
    }

    .session-title {
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .session-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .data-source-card {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 14px;
      padding: 9px 10px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .data-source-card:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .data-source-card span,
    .data-source-card em {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
    }

    .data-source-card b {
      display: block;
      margin: 2px 0;
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-left, .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      border-radius: 11px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .icon-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-2);
    }

    .sidebar-toggle { display: none; }

    .messages {
      overflow: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-start;
      width: 100%;
    }

    .msg.assistant {
      background: #f7f8fa;
      border-radius: 16px;
      padding: 14px;
    }

    .msg.assistant .avatar { display: none; }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      background: var(--green);
    }

    .user .avatar { background: var(--primary); }

    .bubble {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
      line-height: 1.48;
      box-shadow: none;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user .bubble {
      width: auto;
      max-width: min(720px, 78%);
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-radius: 16px;
      padding: 12px 14px;
    }

    .bubble h1, .bubble h2, .bubble h3 { margin: 6px 0 4px; font-size: 15px; line-height: 1.35; }
    .bubble p { margin: 0 0 6px; }
    .bubble ul, .bubble ol { margin: 4px 0 6px; padding-left: 18px; }
    .bubble code { background: #f1f5f9; border-radius: 6px; padding: 1px 4px; }

    .metric-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .metric-strip-label { font-weight: 800; color: #475467; }

    .metric-token {
      padding: 3px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #344054;
      border: 1px solid #dbe4ff;
      font-weight: 700;
    }

    .meta-box {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fbfdff;
    }

    .meta-toggle {
      width: 100%;
      border: 0;
      background: #f8fafc;
      padding: 10px 12px;
      text-align: left;
      color: #344054;
      font-weight: 700;
      cursor: pointer;
    }

    .meta-content { display: none; padding: 12px; }
    .meta-box.open .meta-content { display: block; }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }

    .table-wrap {
      margin-top: 8px;
      overflow-x: auto;
      overflow-y: visible;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fff;
    }

    .markdown-table {
      margin: 8px 0 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;
      min-width: 96px;
      max-width: 260px;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      z-index: 1;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: rgba(255,255,255,.88);
    }

    .composer-inner {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 18px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      font: inherit;
      line-height: 1.5;
      padding: 10px 8px;
      background: transparent;
    }

    .skill-picker {
      position: relative;
      flex: 0 0 auto;
    }

    .skill-current {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: #344054;
      border-radius: 14px;
      padding: 11px 12px;
      min-width: 92px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .skill-current.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-2);
    }

    .skill-menu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 10px);
      display: none;
      gap: 8px;
      max-width: min(620px, calc(100vw - 36px));
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 12px 36px rgba(15, 23, 42, .16);
      overflow-x: auto;
      z-index: 10;
    }

    .skill-picker.open .skill-menu { display: flex; }

    .skill-option {
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .skill-option.selected {
      color: #fff;
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }

    .send {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      min-width: 88px;
    }

    .send:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .block-stack { display: grid; gap: 8px; min-width: 0; }

    .bi-card {
      min-width: 0;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .bi-title {
      margin: 0 0 5px;
      font-size: 13px;
      font-weight: 800;
      color: #1f2937;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .kpi-card {
      border: 1px solid #dbeafe;
      background: #eff6ff;
      border-radius: 12px;
      padding: 8px 10px;
    }

    .kpi-card b { display: block; font-size: 16px; line-height: 1.25; color: #1d4ed8; }
    .kpi-card span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill { padding: 4px 8px; border-radius: 999px; background: #ecfdf3; color: #027a48; font-size: 11px; font-weight: 700; }

    .insight-list, .action-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .insight-list li, .action-list li {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 7px 9px;
    }

    .bar-chart { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
    .bar-track { height: 10px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--green)); }
    .bar-value { color: var(--muted); font-variant-numeric: tabular-nums; }

    .report-shell {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #dbeafe;
    }

    .report-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .download-report-btn {
      border: 1px solid var(--primary);
      background: var(--primary-soft);
      color: var(--primary-2);
      border-radius: 999px;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .followups { display: flex; flex-wrap: wrap; gap: 6px; }
    .followup-btn { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 8px; cursor: pointer; color: #344054; font-size: 12px; }
    .followup-btn:hover { background: var(--primary-soft); border-color: var(--primary); }

    .message-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
    .message-action-btn { border: 1px solid var(--border); background: #fff; color: #344054; border-radius: 999px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .message-action-btn:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-2); }

    .reply-banner { display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 8px; padding: 8px 10px; border: 1px solid #bfdbfe; background: #eff6ff; border-radius: 12px; color: #1e3a8a; font-size: 12px; }
    .reply-banner.show { display: flex; }
    .reply-banner-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-banner-close { border: 0; background: transparent; color: #1d4ed8; cursor: pointer; font-weight: 800; }

    .action-modal-overlay { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .36); align-items: center; justify-content: center; padding: 18px; }
    .action-modal-overlay.show { display: flex; }
    .action-modal { width: min(520px, 100%); max-height: min(720px, 92vh); overflow: auto; background: #fff; border-radius: 18px; box-shadow: 0 24px 80px rgba(15, 23, 42, .22); border: 1px solid var(--border); }
    .action-modal-header, .action-modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .action-modal-footer { border-top: 1px solid var(--border); border-bottom: 0; justify-content: flex-end; }
    .action-modal-title { font-weight: 900; }
    .action-modal-body { padding: 14px 16px; display: grid; gap: 12px; }
    .form-row { display: grid; gap: 7px; }
    .form-row label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .option-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-chip { border: 1px solid var(--border); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
    .option-chip.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-2); font-weight: 800; }
    .modal-btn { border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    .modal-btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .mock-success { padding: 10px 12px; border-radius: 12px; background: #ecfdf3; color: #027a48; font-size: 13px; }

    .mobile-chips { display: none; }
    .typing { color: var(--muted); }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        height: 100dvh;
        padding: 0;
        gap: 0;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(86vw, 320px);
        z-index: 30;
        border-radius: 0 22px 22px 0;
        transform: translateX(-100%);
        transition: transform .2s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(15, 23, 42, .36);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease;
      }

      .sidebar-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .main {
        border-radius: 0;
        border: 0;
        height: 100dvh;
      }

      .topbar {
        padding: 8px 10px;
      }

      .topbar h2 { font-size: 16px; }
      .sidebar-toggle { display: grid; }
      .icon-btn { width: 32px; height: 32px; border-radius: 10px; }

      .messages {
        padding: 14px;
      }

      .user .bubble {
        max-width: calc(100vw - 58px);
        padding: 10px 11px;
        border-radius: 14px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }

      .mobile-chips { display: none; }

      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .bar-row { grid-template-columns: 90px 1fr; }
      .bar-value { grid-column: 2; }
      .composer { padding: 10px; }
      .composer-inner { border-radius: 16px; gap: 7px; }
      .skill-current { min-width: 58px; max-width: 72px; padding: 10px 8px; overflow: hidden; text-overflow: ellipsis; }
      .skill-menu { left: 0; max-width: calc(100vw - 20px); padding: 7px; }
      .skill-option { padding: 7px 9px; font-size: 12px; }
      .send { min-width: 70px; padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <h1>销数通 AI Copilot</h1>
          <p>自然语言问数 · 客户诊断 · 机会建议</p>
        </div>
      </div>

      <div class="status" id="status">正在检查数据与模型配置...</div>

      <div class="sidebar-scroll">
        <div class="section-title">推荐问题</div>
        <div class="chips" id="desktopChips"></div>

        <div class="section-title">会话列表</div>
        <div class="session-list" id="sessionList"></div>
      </div>

      <div class="section-title">数据源</div>
      <button class="data-source-card" id="dataSourceCard" type="button" aria-label="切换数据源">
        <span>数据源</span>
        <b id="dataSourceName">ads_auto_commercial_daily_wide</b>
        <em>点击切换</em>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn sidebar-toggle" id="sidebarToggleBtn" type="button" aria-label="展开侧栏">☰</button>
          <h2>销数通</h2>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="newSessionBtn" type="button" aria-label="新建会话">＋</button>
          <button class="icon-btn" id="clearBtn" type="button" aria-label="清空当前会话">⌫</button>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="mobile-chips" id="mobileChips"></div>
      </section>

      <footer class="composer">
        <div class="reply-banner" id="replyBanner"></div>
        <div class="composer-inner">
          <div class="skill-picker" id="skillPicker">
            <button class="skill-current" id="skillCurrent" type="button">自动</button>
            <div class="skill-menu" id="skillMenu"></div>
          </div>
          <textarea id="input" rows="1" placeholder="例如：哪些客户消耗高但没有订单？"></textarea>
          <button class="send" id="sendBtn">发送</button>
        </div>
      </footer>
    </main>
  </div>
  <div class="action-modal-overlay" id="actionModalOverlay"></div>

  <script>
    const suggestions = [
      '我想拜访一个客户，告诉我几个有用的话术',
      '我的客户中本月环比上月消耗下降20%的客户出现哪些问题，给我做归因分析',
      '帮我生成上周销售周报',
      '本月客户消耗 Top10 是谁？',
      '哪些客户余额快没了？',
      '哪些客户消耗高但没有订单？',
      '哪些客户逾期应收最高？',
      '线索通和信息流广告哪个效果更好？',
      '哪些客户适合追加预算？'
    ];

    const skillOptions = [
      { value: 'auto', label: '自动' },
      { value: 'general_chat', label: '普通对话' },
      { value: 'sql_query', label: '数据查询' },
      { value: 'attribution_analysis', label: '归因分析' },

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    function isMarkdownTableSeparator(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function splitMarkdownTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function renderMarkdownTable(lines, start) {
      const headers = splitMarkdownTableRow(lines[start]);
      let end = start + 2;
      const rows = [];
      while (end < lines.length && /^\s*\|.*\|\s*$/.test(lines[end]) && !isMarkdownTableSeparator(lines[end])) {
        rows.push(splitMarkdownTableRow(lines[end]));
        end += 1;
      }
      let html = '<div class="table-wrap markdown-table"><table><thead><tr>';
      html += headers.map(cell => `<th>${escapeHtml(cell)}</th>`).join('');
      html += '</tr></thead><tbody>';
      html += rows.map(row => `<tr>${headers.map((_, idx) => `<td>${escapeHtml(row[idx] ?? '')}</td>`).join('')}</tr>`).join('');
      html += '</tbody></table></div>';
      return { html, end };
    }

    function markdownLite(text) {
      const lines = String(text ?? '').split('\n');
      const parts = [];
      let buffer = [];
      const flush = () => {
        if (!buffer.length) return;
        let html = escapeHtml(buffer.join('\n'));
        html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
        html = html.replace(/\n{2,}/g, '</p><p>');
        html = html.replace(/\n/g, '<br>');
        parts.push(`<p>${html}</p>`.replace(/<p><\/p>/g, ''));
        buffer = [];
      };

      for (let i = 0; i < lines.length; i++) {
        if (/^\s*\|.*\|\s*$/.test(lines[i]) && i + 1 < lines.length && isMarkdownTableSeparator(lines[i + 1])) {
          flush();
          const table = renderMarkdownTable(lines, i);
          parts.push(table.html);
          i = table.end - 1;
        } else {
          buffer.push(lines[i]);
        }
      }
      flush();
      return parts.join('');
    }

    function appendMessage(message) {
      if (!message.id) message.id = createMessageId();
      const { role, content, meta } = message;
      const wrapper = document.createElement('div');
      wrapper.className = `msg ${role}`;
      wrapper.dataset.messageId = message.id || '';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      }
      if (role === 'assistant' && meta && Array.isArray(meta.blocks) && meta.blocks.length) {
        bubble.appendChild(renderAssistantBlocks(meta));
      } else {
        bubble.insertAdjacentHTML('beforeend', role === 'assistant' ? markdownLite(content) : escapeHtml(content));
      }

      if (role === 'assistant') {
        bubble.appendChild(buildAssistantActions(message));
      }
      if (meta) {
        bubble.appendChild(buildMeta(meta));
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrapper;
    }

    function extractUsedMetrics(meta) {
      const metricNames = new Set();
      const metricMap = {
        cost_amount: '消耗', cash_cost_amount: '现金消耗', grant_cost_amount: '赠款消耗',
        recharge_amount: '充值', net_recharge_amount: '净充值',
        confirmed_revenue_amount: '确认收入', contract_amount: '合同金额', received_amount: '回款', receivable_amount: '应收', overdue_receivable_amount: '逾期应收',
        impression_cnt: '曝光', click_cnt: '点击', valid_click_cnt: '有效点击', ctr: 'CTR', cpc: 'CPC', cpm: 'CPM',
        lead_cnt: '线索', valid_lead_cnt: '有效线索', phone_lead_cnt: '电话线索', form_lead_cnt: '表单线索', im_lead_cnt: 'IM线索', test_drive_lead_cnt: '试驾线索',
        arrival_cnt: '到店', test_drive_cnt: '试驾', order_cnt: '订单', vehicle_sales_cnt: '成交车辆',
        gmv_amount: 'GMV', roi: 'ROI', cost_per_lead: 'CPL', cost_per_order: 'CPO',
        available_balance_amount: '可用余额', active_campaign_cnt: '活跃计划', active_customer_cnt: '活跃客户',
        customer_count: '签约客户数', avg_customer_value: '客单价', renewal_rate: '续费率'
      };
      const knownMetrics = ['消耗', '广告消耗金额', '充值', '充值金额', '确认收入', '收入', '回款', '合同金额', '线索', '有效线索', '订单', 'GMV', 'ROI', 'CPL', 'CTR', '逾期应收', '余额', '客单价', '续费率', '活跃度'];
      const addMetric = value => {
        const text = String(value || '');
        if (!text) return;
        for (const [field, label] of Object.entries(metricMap)) {
          if (text === field || text.includes(field)) metricNames.add(label);
        }
        for (const metric of knownMetrics) {
          if (text.includes(metric)) metricNames.add(metric);
        }
      };
      for (const block of meta.blocks || []) {
        addMetric(block.title);
        if (block.type === 'kpi_cards') {
          for (const item of block.items || []) addMetric(item.label);
        }
        if (block.type === 'table') {
          for (const col of block.columns || []) addMetric(col);
        }
        if (block.type === 'chart') {
          addMetric(block.chartType);
          const items = block.data && block.data.items || [];
          if (items[0]) Object.keys(items[0]).forEach(addMetric);
        }
      }
      for (const col of meta.columns || []) addMetric(col);
      for (const row of (meta.rows || []).slice(0, 3)) Object.keys(row || {}).forEach(addMetric);
      const debugText = `${meta.reason || ''} ${meta.sql || ''} ${JSON.stringify(meta.debug || {})}`;
      addMetric(debugText);
      return Array.from(metricNames).slice(0, 6);
    }

    function renderMetricStrip(meta) {

        const token = document.createElement('span');
        token.className = 'metric-token';
        token.textContent = metric;

      }

    }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) appState = JSON.parse(raw);

      if (!appState.sessions || !appState.sessions.length) {
        const session = createSession();
        appState = { currentSessionId: session.id, sessions: [session] };
      }
      if (!appState.sessions.some(session => session.id === appState.currentSessionId)) {
        appState.currentSessionId = appState.sessions[0].id;
      }
    }

      let session = appState.sessions.find(item => item.id === appState.currentSessionId);

        appState.sessions.unshift(session);
        appState.currentSessionId = session.id;
      }
      return session;

    function formatSessionTime(ts) {
      const date = new Date(ts);

      const sameDay = date.toDateString() === today.toDateString();

      return `${date.getMonth() + 1}-${date.getDate()} ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;

      const replyTarget = findMessageById(session, session.replyTargetMessageId);
      if (replyTarget && replyTarget.role === 'assistant' && replyTarget.meta) return buildAssistantContext(replyTarget.meta);

    async function downloadReportImage(shell, filename) {
      const target = shell.querySelector('.report-export-root') || shell;
      if (window.html2canvas) {
        const canvas = await window.html2canvas(target, { backgroundColor: '#ffffff', scale: 2 });
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
        return;
      }
      const rect = target.getBoundingClientRect();
      const width = Math.ceil(rect.width || 1200);
      const height = Math.ceil(target.scrollHeight || rect.height || 800);
      const styles = Array.from(document.querySelectorAll('style')).map(style => style.textContent).join('\n');
      const html = `<div xmlns="http://www.w3.org/1999/xhtml"><style>${styles}</style>${target.outerHTML}</div>`;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
      const img = new Image();
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = width * 2;
        canvas.height = height * 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = url;
    }

    }

    function renderBlocks(blocks) {
      const stack = document.createElement('div');
      stack.className = 'block-stack';
      for (const block of blocks) {
        const el = renderBlock(block);
        if (el) stack.appendChild(el);
      }
      return stack;
    }

    function renderBlock(block) {
      if (!block || !block.type) return null;
      if (block.type === 'summary') {
        const card = createCard(block.title || '结论');
        const content = document.createElement('div');
        content.innerHTML = markdownLite(block.content || '');
        card.appendChild(content);
        return card;
      }
      if (block.type === 'kpi_cards') {
        const grid = document.createElement('div');
        grid.className = 'kpi-grid';
        for (const item of block.items || []) {
          const card = document.createElement('div');
          card.className = 'kpi-card';
          card.innerHTML = `<b>${escapeHtml(item.value)}</b><span>${escapeHtml(item.label)}</span>`;
          grid.appendChild(card);
        }
        const wrap = createCard(block.title || '核心指标');
        wrap.appendChild(grid);
        return wrap;
      }
      if (block.type === 'tags') {
        const wrap = createCard(block.title || '标签');
        const list = document.createElement('div');
        list.className = 'tag-list';
        for (const item of block.items || []) {
          const tag = document.createElement('span');
          tag.className = 'tag-pill';
          tag.textContent = item;
          list.appendChild(tag);
        }
        wrap.appendChild(list);
        return wrap;
      }
      if (block.type === 'insights' || block.type === 'actions') {
        const wrap = createCard(block.title || (block.type === 'actions' ? '建议动作' : '主要发现'));
        const list = document.createElement('ul');
        list.className = block.type === 'actions' ? 'action-list' : 'insight-list';
        for (const item of block.items || []) {
          const li = document.createElement('li');
          li.textContent = item;
          list.appendChild(li);
        }
        wrap.appendChild(list);
        return wrap;
      }
      if (block.type === 'table') {
        const wrap = createCard(block.title || '明细数据');
        wrap.appendChild(buildTable(block.columns || [], block.rows || []));
        return wrap;
      }
      if (block.type === 'chart') {
        return renderChartBlock(block);
      }
      if (block.type === 'followups') {
        const wrap = createCard(block.title || '你可以继续问');
        const list = document.createElement('div');
        list.className = 'followups';
        for (const item of block.items || []) {
          const btn = document.createElement('button');
          btn.className = 'followup-btn';
          btn.textContent = item;
          btn.onclick = () => { inputEl.value = item; sendMessage(); };
          list.appendChild(btn);
        }
        wrap.appendChild(list);
        return wrap;
      }
      return null;
    }

    function renderChartBlock(block) {
      const wrap = createCard(block.title || '趋势图');
      const chart = document.createElement('div');
      chart.className = 'bar-chart';
      const items = (block.data && block.data.items) || [];
      const max = Math.max(...items.map(item => Number(item.value) || 0), 1);
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'bar-row';
        const label = document.createElement('div');
        label.textContent = item.label;
        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = `${Math.max(4, (Number(item.value) || 0) / max * 100)}%`;
        track.appendChild(fill);
        const value = document.createElement('div');
        value.className = 'bar-value';
        value.textContent = Number(item.value || 0).toLocaleString();
        row.appendChild(label);
        row.appendChild(track);
        row.appendChild(value);
        chart.appendChild(row);
      }
      wrap.appendChild(chart);
      return wrap;
    }

    function buildMeta(meta) {
      const debug = meta.debug || {};
      const sqlText = debug.sql || meta.sql || '';
      const reasonText = debug.reason || meta.reason || '';
      const hasRows = meta.rows && meta.rows.length;
      if (!sqlText && !reasonText && !hasRows && !meta.intent) return document.createDocumentFragment();

      const box = document.createElement('div');
      box.className = 'meta-box';
      const toggle = document.createElement('button');
      toggle.className = 'meta-toggle';
      toggle.textContent = `查看执行明细${meta.fallback ? '（本地兜底）' : ''}`;
      toggle.onclick = () => box.classList.toggle('open');
      const content = document.createElement('div');
      content.className = 'meta-content';

      const route = document.createElement('p');
      route.innerHTML = `<strong>意图/技能：</strong>${escapeHtml(meta.intent || '-')} / ${escapeHtml(meta.skill || '-')}`;
      content.appendChild(route);

      if (reasonText) {
        const reason = document.createElement('p');
        reason.innerHTML = `<strong>查询逻辑：</strong>${escapeHtml(reasonText)}`;
        content.appendChild(reason);
      }
      if (sqlText) {
        const sql = document.createElement('pre');
        sql.textContent = sqlText;
        content.appendChild(sql);
      }
      if (hasRows) {
        content.appendChild(buildTable(meta.columns || Object.keys(meta.rows[0]), meta.rows));
      }

      box.appendChild(toggle);
      box.appendChild(content);
      return box;
    }

    function buildTable(columns, rows) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      for (const col of columns) {
        const th = document.createElement('th');
        th.textContent = col;
        tr.appendChild(th);
      }
      thead.appendChild(tr);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (const row of rows.slice(0, 100)) {
        const trBody = document.createElement('tr');
        for (const col of columns) {
          const td = document.createElement('td');
          td.textContent = row[col] ?? '';
          trBody.appendChild(td);
        }
        tbody.appendChild(trBody);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;
      const session = getCurrentSession();
      const sessionId = session.id;
      const userMessage = { id: createMessageId(), role: 'user', content: text, meta: null };
      const requestContext = getPreferredAssistantContext(session);
      session.messages.push(userMessage);
      appendMessage(userMessage);
      renameSessionFromFirstQuestion(session, text);
      session.updatedAt = Date.now();
      inputEl.value = '';
      autoResize();
      sendBtn.disabled = true;
      skillPicker.classList.remove('open');
      saveSessions();
      renderSessionList();
      const loadingText = selectedSkill === 'auto'
        ? '正在理解问题并选择合适的销售分析技能...'
        : `正在使用「${getSkillLabel(selectedSkill)}」技能处理...`;
      const loading = appState.currentSessionId === sessionId
        ? appendMessage({ id: createMessageId(), role: 'assistant', content: `<span class="typing">${escapeHtml(loadingText)}</span>`, meta: null })
        : null;
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: session.history, skill: selectedSkill, context: requestContext })
        });
        const data = await resp.json();
        if (loading) loading.remove();
        if (!resp.ok || data.error) throw new Error(data.error || '请求失败');
        const assistantMessage = { id: createMessageId(), role: 'assistant', content: data.answer, meta: data };
        session.messages.push(assistantMessage);
        session.history.push({ role: 'user', content: text });
        session.history.push({ role: 'assistant', content: data.answer });
        session.replyTargetMessageId = '';
        session.updatedAt = Date.now();
        renderReplyBanner();
        saveSessions();
        renderSessionList();
        if (appState.currentSessionId === sessionId) {
          appendMessage(assistantMessage);
        }
      } catch (err) {
        if (loading) loading.remove();
        const errorContent = `## 请求失败\n${err.message}\n\n请检查服务是否运行，以及 MiniMax API 环境变量是否配置正确。`;
        session.messages.push({ id: createMessageId(), role: 'assistant', content: errorContent, meta: null });
        session.updatedAt = Date.now();
        saveSessions();
        renderSessionList();
        if (appState.currentSessionId === sessionId) {
          appendMessage({ id: createMessageId(), role: 'assistant', content: errorContent, meta: null });
        }
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, 140)}px`;
    }

    async function loadHealth() {
      try {
        const resp = await fetch('/api/health');
        const data = await resp.json();
        dataSourceName.textContent = data.table || 'ads_auto_commercial_daily_wide';
        statusEl.innerHTML = `
          <div><strong>当前模型：</strong>${escapeHtml(data.model)}</div>
          <div><strong>模型状态：</strong><span class="${data.minimaxConfigured ? 'ok' : 'warn'}">${data.minimaxConfigured ? '已配置' : '未配置'}</span></div>
        `;
      } catch {
        statusEl.innerHTML = '<span class="warn">服务未连接</span>';
      }
    }

    sendBtn.onclick = sendMessage;
    skillCurrent.onclick = () => skillPicker.classList.toggle('open');
    document.addEventListener('click', event => {
      if (!skillPicker.contains(event.target)) {
        skillPicker.classList.remove('open');
      }
    });
    newSessionBtn.onclick = newSession;
    clearBtn.onclick = clearCurrentSession;
    dataSourceCard.onclick = () => {
      appendMessage({ id: createMessageId(), role: 'assistant', content: '## 数据源切换\n当前版本仅接入 `ads_auto_commercial_daily_wide`。后续可以在这里扩展更多数据源，用于不同方向的销售分析。', meta: null });
    };
    sidebarToggleBtn.onclick = openSidebarDrawer;
    sidebarOverlay.onclick = closeSidebarDrawer;
    actionModalOverlay.onclick = event => {
      if (event.target === actionModalOverlay || event.target.hasAttribute('data-close-modal')) closeActionModal();
    };
    inputEl.addEventListener('input', autoResize);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function openSidebarDrawer() {
      sidebarEl.classList.add('open');
      sidebarOverlay.classList.add('show');
    }

    function closeSidebarDrawer() {
      sidebarEl.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    }

    initChips();
    initSkillPicker();
    loadSessions();
    renderCurrentSession();
    saveSessions();
    loadHealth();
  </script>
</body>
</html>
